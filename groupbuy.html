<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>魚樂匯｜進口魚代購團</title>
<meta name="description" content="魚樂匯 進口魚代購團 價目表與線上訂購，10/17（六）18:00 截止">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#162950;--navy2:#22396b;--gold:#c8a84b;--gold2:#ddd08a;--bg:#f7f5ef;--card:#fff;--ink:#1c2333;--mute:#6b7280;--line:#e6e1d3;--red:#b42318}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
header{background:var(--navy);color:#fff;padding:22px 16px 18px;text-align:center}
.brand{font-family:"Shippori Mincho",serif;letter-spacing:.2em;color:var(--gold2);font-size:13px}
h1{font-family:"Shippori Mincho",serif;font-size:24px;margin:6px 0 10px;letter-spacing:.06em}
.cd{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--gold);color:var(--gold2);border-radius:999px;padding:5px 14px;font-size:13px}
.cd b{color:#fff;font-variant-numeric:tabular-nums}
.rules{max-width:820px;margin:12px auto 0;padding:0 16px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{font-weight:700;color:var(--navy);cursor:pointer}
details ul{margin:8px 0 2px;padding-left:18px;font-size:14px;line-height:1.75;color:#374151}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--line)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.search:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.count{font-size:12px;color:var(--mute);padding-top:4px}
main{padding-bottom:110px}
.cat{font-family:"Shippori Mincho",serif;color:var(--navy);font-size:17px;margin:18px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--gold)}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}
.item.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.info{flex:1;min-width:0}
.nm{font-weight:700;font-size:15px;line-height:1.35}
.no{color:var(--mute);font-weight:400;font-size:12px;margin-right:4px}
.meta{font-size:13px;color:var(--mute);margin-top:2px}
.pr{font-weight:700;color:var(--navy);font-size:16px;white-space:nowrap;text-align:right}
.pr small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.step button{width:34px;height:34px;border:0;background:#f3f1ea;color:var(--navy);font-size:18px}
.step button:disabled{opacity:.35}
.step span{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.add{flex:none;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;height:36px;padding:0 12px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--navy);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.cartbar .wrap{display:flex;align-items:center;gap:12px;padding:0}
.cartbar .sum{flex:1;font-size:14px}
.cartbar .sum b{font-size:19px;color:var(--gold2);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.line{background:#06c755;color:#fff}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mask{position:fixed;inset:0;background:rgba(10,18,38,.5);z-index:20;display:none}
.mask.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet .wrap{padding:16px}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-head h2{font-family:"Shippori Mincho",serif;color:var(--navy);margin:0;font-size:20px}
.x{border:0;background:none;font-size:26px;color:var(--mute)}
.cl{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 0}
.cl .info .meta{margin:0}
.tot{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
.tot.big{font-size:20px;font-weight:700;color:var(--navy);border-top:2px solid var(--gold);margin-top:6px;padding-top:10px}
.warn{background:#fff7e6;border:1px solid #f3d38a;color:#7a5a00;border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
form label{display:block;font-size:13px;color:#374151;margin:10px 0 4px}
form input,form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;font-family:inherit}
.acts{display:grid;gap:8px;margin:16px 0 8px}
.hint{font-size:12px;color:var(--mute);text-align:center}
.closed{background:var(--red);color:#fff;text-align:center;padding:10px;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:420px){.item{flex-wrap:wrap}.info{flex-basis:calc(100% - 100px)}.pr{flex:1;text-align:left}}
</style>
</head>

<div id="closed" class="closed" hidden>本次代購團已截止收單，謝謝支持！</div>
<header>
  <div class="brand">JOYFUL FISH ・ 魚樂匯</div>
  <h1>進口魚代購團</h1>

<main class="wrap" id="list"></main>

<div class="cartbar"><div class="wrap">

<div class="mask" id="mask"></div>

  <div class="warn">運費另計。代購需向國外訂貨，品項未達進口門檻可能無法成團，結單後會以 LINE 通知最終金額。</div>
  <form id="f" autocomplete="on">
    <label>LINE 顯示名稱 *</label><input name="line" required>
    <label>收件人姓名 *</label><input name="name" required autocomplete="name">
    <label>手機 *</label><input name="phone" required type="tel" autocomplete="tel" inputmode="tel">
    <label>收件地址 *</label><input name="addr" required autocomplete="street-address">
    <label>備註</label><textarea name="note" rows="2"></textarea>
  </form>
  <div class="acts">
    <button class="btn line" id="sendLine">送出並傳到 LINE 官方帳號</button>
    <button class="btn ghost" id="copy">只複製訂單文字</button>
  </div>
  <p class="hint">按下後會開啟 LINE，訂單內容已自動帶入，記得按「傳送」才算完成下單。</p>
</div></section>
<div class="toast" id="toast"></div>

var $ = function (s) { return document.querySelector(s); };
var byNo = {}; ITEMS.forEach(function (it) { byNo[it[0]] = it; });
var cart = {};
try { cart = JSON.parse(localStorage.getItem(CFG.storeKey) || '{}') || {}; } catch (e) { cart = {}; }
var deadline = new Date(CFG.deadline).getTime();
var isClosed = function () { return Date.now() >= deadline; };
var fmt = function (n) { return n.toLocaleString('zh-TW'); };
var pad = function (n) { return '#' + ('000' + n).slice(-4); };

$('#rules').innerHTML = CFG.rules.map(function (r) { return '<li>' + r + '</li>'; }).join('');

// 分類
var cats = [];
ITEMS.forEach(function (it) { if (cats.indexOf(it[1]) < 0) cats.push(it[1]); });
var curCat = '全部';
$('#chips').innerHTML = ['全部', '已選'].concat(cats).map(function (c) {
  return '<button class="chip' + (c === '全部' ? ' on' : '') + '" data-c="' + c + '">' + c + '</button>';
}).join('');
$('#chips').addEventListener('click', function (e) {
  var b = e.target.closest('.chip'); if (!b) return;
  curCat = b.dataset.c;
  document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); });
  render();
});

function controls(no) {
  var n = cart[no] || 0;
  if (!n) return '<button class="add" data-a="add" data-no="' + no + '"' + (isClosed() ? ' disabled' : '') + '>加入</button>';
  return '<div class="step"><button data-a="dec" data-no="' + no + '" aria-label="減少">−</button><span>' + n +
    '</span><button data-a="inc" data-no="' + no + '" aria-label="增加"' + (n >= CFG.maxGroups || isClosed() ? ' disabled' : '') + '>＋</button></div>';
}
function rowHtml(it) {
  var n = cart[it[0]] || 0;
  return '<div class="item' + (n ? ' sel' : '') + '" data-no="' + it[0] + '"><div class="info"><div class="nm"><span class="no">' + pad(it[0]) + '</span>' +
    it[2] + '</div><div class="meta">' + it[3] + ' ｜ 每組 ' + it[4] + ' ' + it[5] + (n ? ' ｜ 共 ' + fmt(n * it[4]) + ' ' + it[5] : '') +
    '</div></div><div class="pr">$' + fmt(it[6]) + '<small>/ 組</small></div>' + controls(it[0]) + '</div>';
}

function render() {
  var q = $('#q').value.trim().toLowerCase().replace(/^#0*/, '');
  var list = ITEMS.filter(function (it) {
    if (curCat === '已選' && !cart[it[0]]) return false;
    if (curCat !== '全部' && curCat !== '已選' && it[1] !== curCat) return false;
    if (!q) return true;
    return (it[2] + ' ' + it[3] + ' ' + it[1]).toLowerCase().indexOf(q) >= 0 || String(it[0]) === q;
  });
  var html = '', last = '';
  list.forEach(function (it) {
    if (it[1] !== last) { html += '<h3 class="cat">' + it[1] + '</h3>'; last = it[1]; }
    html += rowHtml(it);
  });
  $('#list').innerHTML = html || '<div class="empty">' + (curCat === '已選' ? '還沒有選擇任何品項' : '找不到符合的品項') + '</div>';
  $('#count').textContent = '共 ' + list.length + ' 項';
}

function save() { try { localStorage.setItem(CFG.storeKey, JSON.stringify(cart)); } catch (e) {} }
function lines() {
  return Object.keys(cart).map(Number).sort(function (a, b) { return a - b; })
    .filter(function (no) { return byNo[no] && cart[no] > 0; })
    .map(function (no) { var it = byNo[no]; return { it: it, n: cart[no], sub: cart[no] * it[6] }; });
}
function total() { return lines().reduce(function (s, l) { return s + l.sub; }, 0); }

function updateBar() {
  var ls = lines();
  $('#cn').textContent = ls.length;
  $('#ct').textContent = fmt(total());
  $('#openCart').disabled = !ls.length;
}

function change(no, a) {
  if (isClosed()) return;
  var n = cart[no] || 0;
  if (a === 'add' || a === 'inc') n = Math.min(CFG.maxGroups, n + 1);
  if (a === 'dec') n = Math.max(0, n - 1);
  if (n) cart[no] = n; else delete cart[no];
  save(); updateBar();
  document.querySelectorAll('.item[data-no="' + no + '"]').forEach(function (el) {
    var tmp = document.createElement('div'); tmp.innerHTML = rowHtml(byNo[no]); el.replaceWith(tmp.firstChild);
  });
  if ($('#sheet').classList.contains('open')) renderCart();
}
document.addEventListener('click', function (e) {
  var b = e.target.closest('button[data-a]'); if (!b) return;
  change(Number(b.dataset.no), b.dataset.a);
});
$('#q').addEventListener('input', render);

function renderCart() {
  var ls = lines();
  $('#lines').innerHTML = ls.length ? ls.map(function (l) {
    return '<div class="cl"><div class="info"><div class="nm"><span class="no">' + pad(l.it[0]) + '</span>' + l.it[2] + '</div><div class="meta">' +
      l.it[3] + ' ｜ $' + fmt(l.it[6]) + ' × ' + l.n + ' 組（' + fmt(l.n * l.it[4]) + ' ' + l.it[5] + '）</div></div><div class="pr">$' + fmt(l.sub) + '</div>' + controls(l.it[0]) + '</div>';
  }).join('') : '<div class="empty">訂單是空的</div>';
  $('#gt').textContent = fmt(total());
}
function openCart() { renderCart(); $('#sheet').classList.add('open'); $('#mask').classList.add('open'); }
function closeCart() { $('#sheet').classList.remove('open'); $('#mask').classList.remove('open'); }
$('#openCart').onclick = openCart; $('#closeCart').onclick = closeCart; $('#mask').onclick = closeCart;

// 顧客資料記憶
var f = $('#f');
try { var saved = JSON.parse(localStorage.getItem('jf-customer') || '{}'); Object.keys(saved).forEach(function (k) { if (f[k]) f[k].value = saved[k]; }); } catch (e) {}

function orderText(id, c) {
  var t = '【魚樂匯 代購團訂單】' + id + '\n';
  t += 'LINE：' + c.line + '\n收件人：' + c.name + '\n手機：' + c.phone + '\n地址：' + c.addr + '\n';
  t += '———————\n';
  lines().forEach(function (l) {
    t += pad(l.it[0]) + ' ' + l.it[2] + ' ' + l.it[3] + ' × ' + l.n + '組（' + (l.n * l.it[4]) + l.it[5] + '）$' + fmt(l.sub) + '\n';
  });
  t += '———————\n商品合計：$' + fmt(total()) + '（運費另計）';
  if (c.note) t += '\n備註：' + c.note;
  return t;
}
function getCustomer() {
  if (!f.reportValidity()) return null;
  var c = { line: f.line.value.trim(), name: f.name.value.trim(), phone: f.phone.value.trim(), addr: f.addr.value.trim(), note: f.note.value.trim() };
  try { localStorage.setItem('jf-customer', JSON.stringify({ line: c.line, name: c.name, phone: c.phone, addr: c.addr })); } catch (e) {}
  return c;
}
function newId() {
  var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
  return 'JF' + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
}
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(function () { t.classList.remove('show'); }, 2200); }
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); } catch (e) {} a.remove(); return Promise.resolve();
}
function sendSheet(id, c) {
  if (!CFG.sheetUrl) return;
  var payload = { id: id, customer: c, total: total(), items: lines().map(function (l) { return { no: l.it[0], cat: l.it[1], name: l.it[2], size: l.it[3], groups: l.n, qty: l.n * l.it[4], unit: l.it[5], price: l.it[6], sub: l.sub }; }) };
  try { fetch(CFG.sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }); } catch (e) {}
}

$('#sendLine').onclick = function () {
  if (isClosed()) { toast('已截止收單'); return; }
  if (!lines().length) return;
  var c = getCustomer(); if (!c) return;
  var id = newId(), t = orderText(id, c);
  sendSheet(id, c);
  copyText(t);
  location.href = 'https://line.me/R/oaMessage/' + encodeURIComponent(CFG.lineId) + '/?' + encodeURIComponent(t);
};
$('#copy').onclick = function () {
  if (!lines().length) return;
  var c = getCustomer(); if (!c) return;
  copyText(orderText(newId(), c)).then(function () { toast('已複製，請貼到魚樂匯 LINE 官方帳號'); });
};

// 倒數
function tick() {
  var ms = deadline - Date.now();
  if (ms <= 0) {
    $('#cd').textContent = '已截止'; $('#closed').hidden = false;
    $('#sendLine').disabled = true; $('#copy').disabled = true;
    return;
  }
  var d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
  $('#cd').textContent = (d ? d + ' 天 ' : '') + h + ' 時 ' + m + ' 分';
  setTimeout(tick, 30000);
}
tick(); render(); updateBar();
</script>
</body>
</html>
