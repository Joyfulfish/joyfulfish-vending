<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魚樂匯 水族販賣機 | 線上選購 階梯優惠</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-section">
                <img src="logo.png" alt="魚樂匯 Logo">
            </div>
            <div class="brand-title">
                <h1>魚樂匯 水族販賣機</h1>
                <p>精選水族商品 · 階梯優惠 · 一次購足</p>
            </div>
            <div class="qr-section">
                <img src="line_qrcode.png" alt="LINE QR Code">
                <a href="https://line.me/R/ti/p/@joyfulfish" class="line-btn" target="_blank" rel="noopener">
                    <span>📱</span>
                    <span>加入 LINE 訂購</span>
                </a>
            </div>
        </div>
    </header>

    <!-- 搜尋欄 -->
    <div class="search-bar">
        <div class="search-container">
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="🔍 搜尋商品名稱、分類、尺寸..."
                oninput="handleSearch()"
            >
            <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
            <span class="search-icon">🔍</span>
        </div>
    </div>

    <!-- 分類篩選 -->
    <div class="filter-bar">
        <div class="filter-container" id="filterContainer">
            <button class="filter-btn active" data-category="全部">全部商品</button>
        </div>
    </div>

    <!-- 商品列表 -->
    <div class="products-container">
        <div id="searchResultText"></div>
        <div class="products-grid" id="productsGrid">
            <div class="loading">載入商品中</div>
        </div>
    </div>

    <!-- 購物車浮動按鈕 -->
    <button class="cart-btn" onclick="toggleCart()">
        🛒
        <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
    </button>

    <!-- 購物車彈窗 -->
    <div class="cart-modal" id="cartModal" onclick="closeCartOnBackdrop(event)">
        <div class="cart-content" onclick="event.stopPropagation()">
            <div class="cart-header">
                <h2>詢價清單</h2>
                <button class="cart-close" onclick="toggleCart()">✕</button>
            </div>
            <div class="cart-items" id="cartItems">
                <div class="cart-empty">
                    <div class="cart-empty-icon">🛒</div>
                    <p>購物車是空的</p>
                    <p style="font-size: 0.9rem; margin-top: 0.5rem;">快去選購商品吧！</p>
                </div>
            </div>
            <div class="cart-footer" id="cartFooter" style="display: none;">
                <div class="cart-total">
                    <span>總計</span>
                    <span id="cartTotalPrice">NT$ 0</span>
                </div>
                <button class="cart-submit-btn" onclick="submitToLine()">
                    ✨ 一鍵送出至 LINE
                </button>
            </div>
        </div>
    </div>

    <!-- Footer 訪客統計 -->
    <footer>
        <div class="visitor-stats">
            <div class="stat-item">
                <div class="stat-label">👁️ 當前在線人數</div>
                <div class="stat-value" id="onlineVisitors">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">📊 總瀏覽次數</div>
                <div class="stat-value" id="totalViews">-</div>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-text">
            © 2026 魚樂匯 JoyfulFish · 精選水族商品
        </div>
    </footer>

    <!-- 載入順序有相依性，請勿調換 -->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/line-order.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
